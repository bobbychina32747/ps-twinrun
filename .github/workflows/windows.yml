name: Windows comparison
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Run the public launcher and check all three results
        shell: pwsh
        run: ./tests/smoke.ps1
