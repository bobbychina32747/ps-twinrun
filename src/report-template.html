<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><title>PowerShell comparison | PS TwinRun</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f0;color:#172823;font:16px/1.5 "Segoe UI",Arial,sans-serif}main{max-width:1030px;margin:auto;padding:26px 36px 50px}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:15px;border-bottom:2px solid #25483e;font-weight:650}.brand{display:flex;gap:9px;align-items:center}
.mark{display:inline-grid;place-items:center;width:29px;height:28px;background:#244a3c;color:#c8f28c;border-radius:5px;font:700 15px/1 Consolas,monospace}.source,.engine,.output-label,.fileline span,code,pre,.diff,.same{font-family:Consolas,"Courier New",monospace}.source,.quiet{color:#485b53}.source{font-size:13px}
header{display:flex;align-items:center;justify-content:space-between;gap:22px;padding:34px 0 29px}h1{font:normal clamp(33px,5vw,56px)/1.06 Georgia,"Times New Roman",serif;letter-spacing:-.045em;margin:0}
.totals{margin:0;color:#315046;font-weight:600;font-size:15px}.totals strong{color:#172823}.notice{background:#fff1d4;border-left:4px solid #986900;padding:9px 15px;margin-top:14px}
section{padding:22px 23px 23px;background:#fff;border:1px solid #cdd6cd;border-radius:9px;margin-bottom:15px}.casehead,.engine,.fileline{display:flex;align-items:center;justify-content:space-between;gap:10px}
h2{font-size:21px;letter-spacing:-.035em;line-height:1.2;margin:0}.diff,.same{font-size:12px;font-weight:bold;line-height:1.3;padding:4px 8px;border-radius:4px}.diff{background:#ffebcf;color:#754100}.same{background:#e3efdf;color:#315335}
.hint{margin:6px 0 17px;color:#495950;font-size:14px}.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.pane{background:#f6f7f3;border:1px solid #d9ded7;border-top:3px solid #667970;border-radius:4px;padding:11px 13px;min-width:0}.pane+.pane{background:#eff6ef;border-top-color:#4b8057}
.engine{font-size:13px;color:#253b31}.engine>span{white-space:nowrap;color:#455a4c}.output-label{margin-top:10px;font-size:11px;text-transform:uppercase;color:#46594e}.file{margin-top:9px}.fileline{font-size:14px;margin-bottom:5px}.fileline strong{overflow-wrap:anywhere}.fileline span{font-size:13px}
code,pre{font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}pre{margin:2px 0 0;tab-size:4}pre:last-child{margin-bottom:-.45em}details{margin-top:6px;color:#43574a;font-size:12px}summary{width:max-content;cursor:pointer}details code{font-size:11px}.empty{font-size:13px;color:#48584e;margin:10px 0 0}
@media(max-width:700px){main{padding:18px 14px 32px}header{display:block;padding:24px 0 19px}.totals{margin-top:9px}section{padding:15px}.split{grid-template-columns:1fr}.casehead{align-items:flex-start;flex-wrap:wrap}.source{font-size:11px}.engine{flex-wrap:wrap}}
</style></head>
<body><main>
<div class="top"><div class="brand"><span class="mark" aria-hidden="true">&gt;_</span> PS TwinRun</div><span class="source">Windows &middot; runtime comparison</span></div>
<!--PROVENANCE-->
<header><h1>PowerShell comparison</h1><p class="totals"><strong><!--CHANGED--> / <!--COUNT--></strong> cases differ</p></header>
<!--CASES-->
</main></body></html>
